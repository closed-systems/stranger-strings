name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary_name: stranger-strings
          - runner: macos-latest
            os_name: macos-x86_64
            target: x86_64-apple-darwin
            binary_name: stranger-strings
          - runner: macos-latest
            os_name: macos-aarch64
            target: aarch64-apple-darwin
            binary_name: stranger-strings
          - runner: windows-latest
            os_name: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary_name: stranger-strings.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PKG_NAME="stranger-strings-${{ github.ref_name }}-${{ matrix.os_name }}"
          gzip -c "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" > "$PKG_NAME.gz"
          echo "ASSET=$PKG_NAME.gz" >> "$GITHUB_ENV"

      - name: Package release artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgName = "stranger-strings-${{ github.ref_name }}-${{ matrix.os_name }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "$pkgName.zip"
          "ASSET=$pkgName.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
