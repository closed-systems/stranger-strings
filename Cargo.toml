[package]
name = "stranger-strings"
version = "0.3.2"
edition = "2021"
rust-version = "1.90"
description = "Extract human-readable strings from binary files using trigram-based scoring"
license = "Apache-2.0"
authors = ["Kayne Naughton <kayne@closed.systems>"]
repository = "https://github.com/closed-systems/stranger-strings"
readme = "README.md"
keywords = ["strings", "binary", "reverse-engineering", "forensics", "trigram", "firmware", "malware", "analysis","security"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/.github/**"]

[[bin]]
name = "stranger-strings"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.2"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
encoding_rs = "0.8"
unicode-script = "0.5"
unicode-normalization = "0.1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
